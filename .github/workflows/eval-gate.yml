name: eval gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decides whether the model needs to run at all. The workflow itself always runs, so the
  # "Eval gate" check below always reports, even for a docs-only PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.files.outputs.relevant }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          if echo "$files" | grep -Eq '^(src/|evals/|samples/|pyproject\.toml$|uv\.lock$|\.github/workflows/)|\.python-version$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No app, sample, eval or workflow files changed, skipping the model run." >> "$GITHUB_STEP_SUMMARY"
          fi

  gate:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: ramaraihan12/evalgate/.github/workflows/gate-rag.yml@v0.2.2
    permissions:
      contents: read
      pull-requests: write
    with:
      app_repo: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
      dataset: evals/rag_cases.jsonl
      model: qwen3:1.7b
      model_digest: 8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7
      embed_model: qwen3-embedding:0.6b
      embed_model_digest: ac6da0dfba84a81fdbfbaf330198c33cd77c4cdfc53e8bc50eb581914a15621d
      evalgate_ref: v0.2.2

  # The one stable name to require in branch protection.
  result:
    name: Eval gate
    needs: [changes, gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          GATE: ${{ needs.gate.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "could not tell what changed"; exit 1; fi
          if [ "$RELEVANT" != "true" ]; then echo "nothing to evaluate in this PR"; exit 0; fi
          if [ "$GATE" = "success" ]; then echo "gate passed"; exit 0; fi
          echo "gate result: $GATE"; exit 1
